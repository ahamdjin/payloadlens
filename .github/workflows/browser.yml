name: Browser tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload real product screenshots
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: payloadlens-launch-gallery
          path: launch-assets/*.png
          retention-days: 14
